name = "johndoedle"
pages_build_output_dir = "."
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "johndoedle"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Workers AI judges whether a question fits the answer and groups similar questions.
# Without it the game falls back to simple word matching.
[ai]
binding = "AI"
