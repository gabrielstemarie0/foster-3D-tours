<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>State Flagle</title>
  <meta name="description" content="Guess the US state flag in 6 tries. Every wrong guess reveals another square.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>State Flagle</h1>
    <div class="chips">
      <button class="chip" id="mode-btn" type="button">Daily</button>
      <span class="chip" title="Current streak">🔥 <b id="streak">0</b></span>
    </div>
  </header>

  <main>
    <p class="sub" id="sub">Guess the US state flag. Each wrong guess reveals a square.</p>

    <div class="board" id="board" aria-label="Mystery flag">
      <img id="flag" alt="" draggable="false">
      <div class="tiles" id="tiles"></div>
    </div>

    <p class="status" id="status" aria-live="polite"></p>

    <form id="form" autocomplete="off">
      <div class="combo">
        <input id="guess" type="text" placeholder="Type a state…" aria-label="Guess a state" spellcheck="false" autocapitalize="off">
        <ul id="options" role="listbox" hidden></ul>
      </div>
      <button class="btn" id="submit" type="submit">Guess</button>
    </form>

    <ol class="guesses" id="guesses" aria-label="Your guesses"></ol>

    <section class="end" id="end" hidden>
      <h2 id="end-title"></h2>
      <pre id="share-text" class="share"></pre>
      <div class="row">
        <button class="btn" id="copy" type="button">Copy result</button>
        <button class="btn ghost" id="practice" type="button">Play a random flag</button>
      </div>
      <p class="stats" id="stats"></p>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
